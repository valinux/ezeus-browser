<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>eZeus</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas {
    display: block; outline: none; touch-action: none;
    width: 100vw !important; height: 100dvh !important;
  }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #090f15; color: #eee7d9; font: 15px/1.5 system-ui, sans-serif;
  }
  #loading[hidden] { display: none; }
  .loading-panel { width: min(480px, calc(100vw - 48px)); }
  .loading-heading { display: flex; justify-content: space-between; gap: 16px; }
  #loading-title { margin: 0 0 12px; font-size: 16px; font-weight: 500; }
  #loading-percent { color: #d5b37c; font-variant-numeric: tabular-nums; }
  progress { display: block; width: 100%; height: 12px; accent-color: #d5b37c; }
  progress::-webkit-progress-bar { background: #1c303c; border: 1px solid #536777; border-radius: 2px; }
  progress::-webkit-progress-value { background: #d5b37c; border-radius: 1px; }
  progress::-moz-progress-bar { background: #d5b37c; }
  #loading-detail { margin: 10px 0 0; color: #a9bac5; font-size: 13px; font-variant-numeric: tabular-nums; }
</style>
<body>
<canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="eZeus game"></canvas>
<div id="loading" aria-busy="true">
  <div class="loading-panel">
    <div class="loading-heading"><h1 id="loading-title" role="status">Preparing game engine…</h1><span id="loading-percent"></span></div>
    <progress id="loading-progress" max="1" aria-label="Game loading progress"></progress>
    <p id="loading-detail">Your game will start automatically.</p>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
